[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-damage-detector"
version = "0.1.0"
description = "RDD2022 road damage detection: data audit, YOLO experiments and ONNX export"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "PyYAML>=6,<7"]

[project.optional-dependencies]
train = ["ultralytics>=8.3,<9", "numpy>=2,<3"]
deploy = ["onnx>=1.16,<2", "onnxruntime>=1.18,<2", "numpy>=2,<3", "opencv-python>=4.8,<5"]
demo = ["streamlit>=1.64,<2", "streamlit-drawable-canvas>=0.9.3,<0.10", "ultralytics>=8.3,<9"]
dev = ["pytest>=8,<10"]

[project.scripts]
road-damage = "road_damage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

